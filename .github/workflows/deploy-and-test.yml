name: Enterprise CI/CD Pipeline - Build, Deploy & Live E2E Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target LIVE URL for E2E testing (Overrides BASE_URL)'
        required: false
        default: 'https://vskanna0510.github.io/crispr-sim-app'
      run_full_suite:
        description: 'Execute full 400+ test case catalog'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # BUILD, STATIC ANALYSIS & DEPLOYMENT
  # ============================================================================
  build-and-deploy:
    name: "Stages 1-5: Build & Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Stage 1: Repository Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: "Stage 2: Dependency Installation"
        working-directory: frontend/flutter_app
        run: flutter pub get

      - name: "Stage 4: Static Analysis"
        working-directory: frontend/flutter_app
        run: flutter analyze || true

      - name: "Stage 3: Build Application (Flutter Web)"
        working-directory: frontend/flutter_app
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: "Setup GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "Upload GitHub Pages Artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/flutter_app/build/web

      - name: "Stage 5: Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================================
  # LIVE E2E TESTING, REPORTING & ARTIFACT MANAGEMENT
  # ============================================================================
  live-e2e-testing:
    name: "Stages 6-13: Live E2E Testing & Reporting"
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Repository Checkout"
        uses: actions/checkout@v4

      - name: "Setup Python 3.11 Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Setup Google Chrome & WebDriver"
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: "Stage 2: Install Automation Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: "Compute BASE_URL"
        id: compute-url
        run: |
          CUSTOM_URL="${{ github.event.inputs.base_url }}"
          DEFAULT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          TARGET_URL="${CUSTOM_URL:-${{ vars.BASE_URL || '' }}}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="$DEFAULT_URL"
          fi
          echo "BASE_URL=$TARGET_URL" >> $GITHUB_ENV
          echo "Computed Target URL: $TARGET_URL"

      - name: "Stage 6: Wait for Deployment"
        run: |
          echo "Waiting for live deployment at: $BASE_URL"
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deployment is LIVE and responding with HTTP 200."
              exit 0
            fi
            sleep 5
          done
          echo "Warning: Timeout waiting for HTTP 200. Proceeding to diagnostics..."

      - name: "Stage 7: Deployment Verification"
        run: |
          python -m automation.runner --base-url "$BASE_URL" --verify-only

      - name: "Stages 8, 9, 10 & 12: Run 400+ Selenium E2E Tests & Generate Reports"
        run: |
          python -m automation.runner --base-url "$BASE_URL" --workers 8 --headless

      - name: "Stage 11: Upload Test Artifacts (Excel, HTML, Screenshots, Logs)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Live-Test-Evidence
          path: |
            Test Results/Excel/*.xlsx
            Test Results/HTML/*.html
            Test Results/Screenshots/
            Test Results/Logs/
            Test Results/JSON/*.json
            Test Results/Summary/*.md
          retention-days: 30

      - name: "Stage 13: Store Historical Results"
        if: always()
        run: |
          mkdir -p history/
          cp -r "Test Results/JSON/execution-results.json" "history/execution-$(date +%Y%m%d-%H%M%S).json" || true
          echo "Historical snapshot archived."
