name: Android Appium E2E Automation & GitHub Pages Reporting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily 2:00 AM UTC Nightly Regression

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "android-e2e-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: "Android Emulator + Appium E2E Automation Pipeline"
    runs-on: macos-13  # macOS runner provides native hardware acceleration (KVM/HAXM) for Android Emulator

    steps:
      - name: "Stage 1: Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Stage 2: Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Stage 3: Setup Node.js & Appium 2.x Server"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: "Install Appium & UiAutomator2 Driver"
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: "Setup Python 3.11 Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Install Test Automation Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r android_automation/requirements.txt
          pip install openpyxl requests jinja2 pytest

      - name: "Stage 4: Setup Flutter Environment"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: "Stage 5: Build Android APK"
        run: |
          cd frontend/flutter_app
          flutter pub get
          flutter build apk --debug
          echo "APK_PATH=frontend/flutter_app/build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_ENV

      - name: "Stage 6 & 7: Start Android Emulator & Execute Appium Tests"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "Stage 7: Verifying Emulator Readiness..."
            adb wait-for-device
            adb shell getprop sys.boot_completed
            
            echo "Stage 8: Installing APK..."
            adb install -r frontend/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
            
            echo "Stage 9: Starting Appium Server in Background..."
            appium --address 127.0.0.1 --port 4723 --log appium.log &
            sleep 6
            
            echo "Stage 10: Verifying Appium Health..."
            curl -s http://127.0.0.1:4723/status || true
            
            echo "Stage 11: Executing 400+ Appium E2E Test Cases..."
            python android_automation/runners/runner.py

      - name: "Stage 18: Upload Automation Reports & Evidence Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Appium-Test-Results
          path: |
            Test Results/Excel/*.xlsx
            Test Results/HTML/*.html
            Test Results/JSON/*.json
            Test Results/Summary/*.md
            Test Results/Screenshots/
            Test Results/Logs/
            appium.log
          retention-days: 30

      - name: "Stage 19 & 20: Prepare & Deploy Reports to GitHub Pages"
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-root
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: "Stage 21: Publish GitHub Action Step Summary"
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
